name: Ansible Lint & Security Scan
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Ansible and lint (pinned)
        run: pip install -r ansible/requirements-dev.txt
      - name: Run Ansible Lint (strict, fails the job on any finding)
        working-directory: ansible
        run: ansible-lint
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Trivy scanner
        # pinned to the commit of v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-report.txt'
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
      - name: Generate SBOM (CycloneDX)
        # same pinned commit of trivy-action as above (v0.36.0)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'cyclonedx'
          output: 'sbom.cdx.json'
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
      - name: Build image for SBOM
        run: docker build -t security-monitor:ci .
      - name: Generate image SBOM (CycloneDX)
        # same pinned commit of trivy-action as above (v0.36.0)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'image'
          image-ref: 'security-monitor:ci'
          format: 'cyclonedx'
          output: 'sbom-image.cdx.json'
      - name: Upload image SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-image-cyclonedx
          path: sbom-image.cdx.json
