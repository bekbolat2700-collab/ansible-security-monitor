name: Falco Runtime Security

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  falco-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d version

      - name: Create k3d cluster
        run: |
          k3d cluster create falco-lab --wait
          kubectl get nodes

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Add Falco Helm repo
        run: |
          helm repo add falcosecurity https://falcosecurity.github.io/charts
          helm repo update

      - name: Install Falco with custom rules
        run: |
          helm install falco falcosecurity/falco \
            --namespace falco \
            --create-namespace \
            --set driver.kind=modern_ebpf \
            --set-file 'customRules.custom-rules\.yaml=falco/falco-custom-rules.yaml' \
            --wait --timeout 180s
          kubectl get pods -n falco

      - name: Deploy test pod
        run: |
          kubectl run victim-pod --image=ubuntu:22.04 --restart=Never -- sleep 3600
          kubectl wait --for=condition=Ready pod/victim-pod --timeout=60s
          echo "Pod ready"

      - name: Wait for Falco
        run: |
          kubectl wait --for=condition=Ready pods --all -n falco --timeout=120s
          sleep 15
          echo "Falco ready"

      - name: Simulate Attack Scenarios
        run: |
          echo "=== Attack Simulation ==="

          echo "1. Shell spawned T1059"
          kubectl exec victim-pod -- bash -c "id && whoami && ls -la /etc" || true
          sleep 5

          echo "2. Read sensitive file T1552"
          kubectl exec victim-pod -- bash -c "cat /etc/passwd" || true
          sleep 5

          echo "3. Package manager T1072"
          kubectl exec victim-pod -- bash -c "apt-get update -q" || true
          sleep 15

      - name: Collect Falco Alerts
        run: |
          echo "=== Falco Security Events ==="
          kubectl logs -n falco -l app.kubernetes.io/name=falco --tail=100

      - name: Send Report to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          ALERTS=$(kubectl logs -n falco -l app.kubernetes.io/name=falco --tail=100 | grep -c "Warning\|Notice\|Critical\|WARNING\|NOTICE\|CRITICAL" || echo "0")
          SHELL_ALERTS=$(kubectl logs -n falco -l app.kubernetes.io/name=falco --tail=100 | grep -c "Shell spawned\|shell\|bash" || echo "0")
          CRED_ALERTS=$(kubectl logs -n falco -l app.kubernetes.io/name=falco --tail=100 | grep -c "Sensitive file\|passwd\|shadow" || echo "0")
          NET_ALERTS=$(kubectl logs -n falco -l app.kubernetes.io/name=falco --tail=100 | grep -c "network\|curl\|wget" || echo "0")
          PKG_ALERTS=$(kubectl logs -n falco -l app.kubernetes.io/name=falco --tail=100 | grep -c "apt\|yum\|pip" || echo "0")

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="🦅 *Falco Runtime Security Report*
          ━━━━━━━━━━━━━━━━━━━━━
          📊 *Total Security Events:* ${ALERTS}
          ━━━━━━━━━━━━━━━━━━━━━
          🔍 *By MITRE Technique:*
          🐚 T1059 Shell Execution: ${SHELL_ALERTS}
          🔐 T1552 Credential Access: ${CRED_ALERTS}
          🌐 T1048 Network Exfiltration: ${NET_ALERTS}
          📦 T1072 Package Management: ${PKG_ALERTS}
          ━━━━━━━━━━━━━━━━━━━━━
          🕐 Scan: $(date -u '+%Y-%m-%d %H:%M UTC')
          ✅ Runtime monitoring active"

      - name: Cleanup
        if: always()
        run: k3d cluster delete falco-lab || true
