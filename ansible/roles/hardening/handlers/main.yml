---
- name: Reload sshd
  ansible.builtin.service:
    name: ssh
    state: reloaded
  when: hardening_manage_services | bool

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
  when: hardening_sysctl_apply | bool

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
  when: hardening_manage_services | bool

- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
  when: hardening_manage_services | bool
