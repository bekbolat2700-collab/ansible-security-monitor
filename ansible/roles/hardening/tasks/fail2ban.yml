---
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy the sshd jail
  ansible.builtin.template:
    src: fail2ban_sshd.conf.j2
    dest: /etc/fail2ban/jail.d/10-sshd-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  when: hardening_manage_services | bool
