---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Allow SSH with rate limiting (before the firewall is enabled)
  community.general.ufw:
    rule: limit
    port: "{{ hardening_ssh_port }}"
    proto: tcp

- name: Allow additional ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
  loop: "{{ hardening_firewall_allowed_ports }}"

- name: Deny all other incoming traffic by default
  community.general.ufw:
    default: deny
    direction: incoming

- name: Enable ufw
  community.general.ufw:
    state: enabled
