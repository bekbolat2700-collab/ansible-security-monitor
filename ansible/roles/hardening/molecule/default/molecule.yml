---
# Run from ansible/roles/hardening:  molecule test
# Other distro: MOLECULE_DISTRO=ubuntu2204 molecule test
driver:
  name: docker
platforms:
  - name: "hardening-${MOLECULE_DISTRO:-ubuntu2404}"
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2404}-ansible:latest"
    command: ""
    dns_servers:
      - 8.8.8.8
      - 1.1.1.1
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true
provisioner:
  name: ansible
  env:
    # Molecule links the role as <author>.<role_name>; make plain `hardening` resolve too.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  config_options:
    defaults:
      interpreter_python: auto_silent
verifier:
  name: ansible
